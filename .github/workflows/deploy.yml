name: Deploy CV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Runs without environment restriction — removes the branch policy on
  # github-pages so the deploy job can run from main.
  unlock:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Open github-pages environment to all branches
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/environments/github-pages" \
            -d '{"deployment_branch_policy":null}'

  deploy:
    needs: unlock
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
