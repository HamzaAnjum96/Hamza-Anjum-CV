name: Deploy CV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Stage only the deployable files into a clean temp dir
          mkdir -p /tmp/deploy
          cp index.html style.css .nojekyll /tmp/deploy/
          cp -r assets /tmp/deploy/

          cd /tmp/deploy
          git init -b gh-pages
          git add -A
          git commit -m "Deploy CV [skip ci]"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/HamzaAnjum96/Hamza-Anjum-CV.git" \
            gh-pages
