name: Deploy CV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir /tmp/site
          cp index.html style.css .nojekyll /tmp/site/
          cp -r assets /tmp/site/

          cd /tmp/site
          git init -b gh-pages
          git add -A
          git commit -m "Deploy CV [skip ci]"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/HamzaAnjum96/Hamza-Anjum-CV.git" \
            gh-pages
